# Staff portal. Replace VPS_IP only if you add a server_name later.
# Node listens on 127.0.0.1:3000. This file is the only public door.
#   sudo cp deploy/vps/nginx/ksl-portal.conf /etc/nginx/sites-available/ksl-portal
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/ksl-ip.crt;
    ssl_certificate_key /etc/ssl/private/ksl-ip.key;

    # Documents and videos can be up to 100 MB.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
