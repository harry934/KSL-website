# Public site. Replace VPS_IP with the server address before enabling.
#   sudo sed "s/VPS_IP/YOUR_IP/g" deploy/vps/nginx/ksl-public.conf | sudo tee /etc/nginx/sites-available/ksl-public
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://VPS_IP$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/ksl-ip.crt;
    ssl_certificate_key /etc/ssl/private/ksl-ip.key;

    root /var/www/ksl;
    index index.html;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Public media from STORAGE_DIR/media-public (default STORAGE_DIR=/var/lib/ksl-portal/files).
    # Keep this outside the static document root. Private buckets (downloads, avatars) must NOT be aliased here.
    location ^~ /storage/media-public/ {
        alias /var/lib/ksl-portal/files/media-public/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://www.gstatic.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://VPS_IP:8443 https://translate.googleapis.com https://translate.google.com https://challenges.cloudflare.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://translate.google.com https://challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
