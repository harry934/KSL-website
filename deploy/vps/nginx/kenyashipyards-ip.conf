# Public site on :80 + staff portal proxied at /kwela → 127.0.0.1:3000
# Port 3000 stays closed to the internet. Replace IP if needed.
#   sudo cp deploy/vps/nginx/kenyashipyards-ip.conf /etc/nginx/sites-available/kenyashipyards
#   sudo ln -sf /etc/nginx/sites-available/kenyashipyards /etc/nginx/sites-enabled/kenyashipyards
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 178.162.219.218;

    root /var/www/kenyashipyards;
    index index.html;
    # Hero videos can be up to 50 MB; keep a little headroom for multipart overhead.
    client_max_body_size 55m;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Temporary redirect from the old /admin path (preserve subpaths)
    location = /admin {
        return 301 /kwela;
    }
    location /admin/ {
        rewrite ^/admin/(.*)$ /kwela/$1 permanent;
    }

    # Legacy upload URLs that dropped /kwela (new URL("/api/...", portal) bug)
    location = /api/stored-file {
        return 301 /kwela/api/stored-file$is_args$args;
    }

    # Next.js with NEXT_PUBLIC_BASE_PATH=/kwela
    location /kwela {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 55m;
        client_body_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }
}
